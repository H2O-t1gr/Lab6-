<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Generator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>

    <main class="generator">
      <h1>CSS Generator</h1>
      <p class="student-info">Лабораторна робота №6. Шликов Денис, 19</p>

      <div class="tabs" id="tabs">
        <button class="tab active" type="button" data-tab="radius">
          Border Radius
        </button>
        <button class="tab" type="button" data-tab="min-width">
          Min Width
        </button>
        <button class="tab" type="button" data-tab="overflow">
          Overflow
        </button>
      </div>

      <div class="workspace">
        <div class="settings-panel">
          <div class="tab-content active" data-content="radius">
            <h2>Border Radius</h2>

            <div class="control">
              <label for="top-left">Top Left</label>
              <input id="top-left" type="range" min="0" max="100" value="0">
              <span id="top-left-value">0 px</span>
            </div>

            <div class="control">
              <label for="top-right">Top Right</label>
              <input id="top-right" type="range" min="0" max="100" value="0">
              <span id="top-right-value">0 px</span>
            </div>

            <div class="control">
              <label for="bottom-right">Bottom Right</label>
              <input id="bottom-right" type="range" min="0" max="100" value="0">
              <span id="bottom-right-value">0 px</span>
            </div>

            <div class="control">
              <label for="bottom-left">Bottom Left</label>
              <input id="bottom-left" type="range" min="0" max="100" value="0">
              <span id="bottom-left-value">0 px</span>
            </div>
          </div>

          <div class="tab-content" data-content="min-width">
            <h2>Min Width</h2>
            <div id="min-width-controls">
              <div class="control">
                <label for="min-width">Min Width</label>
                <input id="min-width" type="range" min="0" max="500" value="0">
                <span id="min-width-value">0 px</span>
              </div>
            </div>
          </div>

          <div class="tab-content" data-content="overflow">
            <h2>Overflow</h2>
            <div id="overflow-controls">
              <div class="control">
                <label for="overflow">Overflow</label>
                <select id="overflow">
                  <option value="visible">visible</option>
                  <option value="hidden">hidden</option>
                  <option value="scroll">scroll</option>
                  <option value="auto">auto</option>
                </select>
              </div>
            </div>
          </div>

        </div>
        <div class="output-panel">
          <section class="preview-section">
            <h2>Preview</h2>
            <div class="preview-stage">
              <div id="preview" class="preview">
                <span>Preview</span>
                <button id="preview-button" type="button">Click</button>
              </div>
            </div>
            <p id="coordinates">X: 0; Y: 0</p>
          </section>

          <section class="result">
            <h2>CSS Code</h2>
            <div class="code-window">
              <textarea id="css-code" rows="6" readonly aria-label="Згенерований CSS-код"></textarea>
              <button id="copy-button" type="button">Скопіювати CSS</button>
            </div>
            <p id="copy-message"></p>
          </section>

        </div>
      </div>

      <form id="preset-form">
        <h2>Збереження пресета</h2>
        <label for="preset-name">Назва пресета</label>
        <input id="preset-name" type="text">
        <span id="preset-error"></span>
        <button type="submit">Зберегти</button>
      </form>
    </main>

    <button id="scroll-top" type="button" aria-label="Повернутися вгору">↑</button>

  </body>
</html>
